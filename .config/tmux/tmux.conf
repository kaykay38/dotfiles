###############################
# General Options
###############################
set -wg allow-rename on
set -wg automatic-rename on

# Visual Activity Monitoring between windows
setw -g monitor-activity on
set -g visual-activity on

# Show tmux positions in titles
set -g set-titles on

# Attach to a session if runs otherwise create a new one
new-session -n $HOST

# scrollback size
set -g history-limit 10000

set -g allow-passthrough on

set -g focus-events on
set -g default-terminal "xterm-kitty"

# Tell apps tmux supports true color + graphics
set -as terminal-features ',xterm-kitty:RGB'

# Prevent tmux from messing with escape sequences
set -ga terminal-overrides ",xterm-kitty:Tc"

################################
# Color 
###############################
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

################################
# Status Bar 
###############################
set -g status-bg colour237
# Bell
set-window-option -g window-status-bell-style bg=colour167,fg=colour235 # bg=red, fg=bg
set -g window-status-separator ' ' #remove space between window titles
set-option -g status-left "\
#[fg=colour7, bg=colour241]#{?client_prefix,#[bg=colour167],} ❐ #S "
set-option -g status-right "\
#[fg=colour7, bg=colour241] %a %b %d │\
#[fg=colour7,bg=colour241,bold] %l:%M%p \
#[fg=colour248, bg=colour239]"
#│
set-window-option -g window-status-current-format "\
#[fg=colour239, bg=colour72, bold] #I:#W "
set-window-option -g window-status-format "\
#[fg=colour223, bg=colour239] #I:#W "

###############################
# Keybinds
###############################
# Using the mouse to switch panes
set -g mouse on
# Vertical splits with current working directory
bind-key % split-window -h -c '#{pane_current_path}'
# Horizontal splits with current working directory
bind-key '"' split-window -c '#{pane_current_path}'
