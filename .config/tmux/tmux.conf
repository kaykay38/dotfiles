#################################
# VI Mode
#################################
setw -g mode-keys vi
# Copy from tmux to system clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind p paste-buffer
